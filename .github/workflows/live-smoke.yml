name: live-smoke

# The opt-in sync smoke test, against the REAL public broker and the REAL ntfy
# instance. Deliberately NOT part of `ci.yml` and deliberately not a required
# check: a failure here is information about somebody else's uptime, not a
# regression in this repository, and a pull request that can go red because
# broker.emqx.io is having a bad afternoon teaches everyone to ignore red.
#
# It runs on demand, and once a week so the project finds out when a public
# service changes its behaviour — which is exactly how the retained-message
# caveats in docs/design/research/research-providersAndSync.md were found.
#
# Each run uses a freshly generated random room code and deletes its retained
# message afterwards (a zero-length retained publish), so nothing is left behind
# on a service nobody is paying for.

on:
  workflow_dispatch:
  schedule:
    # Mondays, 06:17 UTC. An odd minute, so as not to pile onto the hour.
    - cron: '17 6 * * 1'

concurrency:
  group: live-smoke
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  smoke:
    name: live transports
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Live transport smoke (EMQX retained + ntfy replay)
        run: npm run test:live
