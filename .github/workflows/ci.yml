name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Invariants (source-text half of invariant 5)
        run: npm run invariants

      - name: Format check
        run: npm run format:check

      - name: Unit tests
        run: npm run test

      # The companion is its own npm workspace with its own tsconfig, ESLint
      # config and vitest project, so it gets its own step: a failure here should
      # read as "the companion broke", not as "the web app's tests broke".
      # KRAKEN_HUB_RESOLVER_NO_DOWNLOAD belts-and-braces the yt-dlp auto-download
      # refusal that `CI` already triggers — no test may reach the network.
      - name: Companion (typecheck, lint, contract tests, build)
        run: npm run check:companion
        env:
          KRAKEN_HUB_RESOLVER_NO_DOWNLOAD: '1'

      - name: Build
        run: npm run build

      - name: Bundle budgets
        run: npm run size

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  e2e:
    name: e2e (chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The browser download is the slow part, so key the cache on the exact
      # Playwright version npm resolved — a version bump must miss the cache,
      # or Playwright refuses to launch the stale build it finds.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # Cached browsers still need the OS-level shared libraries.
      - name: Install Chromium system deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # No build step for the web app: playwright.config.ts's webServer command
      # is `npm run build && npm run preview`, so that build happens there.
      # `companion.spec.ts` compiles the companion itself in a beforeAll, but
      # doing it here too means a compile failure fails fast and legibly.
      - name: Build the companion
        run: npm run build:companion

      - name: e2e tests
        run: npm run test:e2e
        env:
          KRAKEN_HUB_RESOLVER_NO_DOWNLOAD: '1'

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  changelog:
    name: changelog reminder
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Warn when src changed without a CHANGELOG entry
        run: |
          base="origin/${{ github.base_ref }}"
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          changed=$(git diff --name-only "$base"...HEAD)
          if echo "$changed" | grep -q '^src/' && ! echo "$changed" | grep -q '^CHANGELOG.md$'; then
            echo "::warning::This PR touches src/** but does not update CHANGELOG.md ([Unreleased])."
          fi
